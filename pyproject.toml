[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sourcetext"
version = "0.1.0"
description = "Return to source text alongside NLP model output and record interpretive judgments in situ."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "duckdb>=1.0",
    "sqlalchemy>=2.0",
    "duckdb-engine>=0.13",
    "fastapi>=0.110",
    "fastapi-camelcase>=2.0.0",
    "uvicorn>=0.29",
    "nest-asyncio>=1.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "pre-commit>=4.0",
    "build>=1.0",
    "twine>=5.0",
    "httpx2",
]

[tool.hatch.build.targets.wheel]
packages = ["sourcetext"]
artifacts = ["sourcetext/server/static/**"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]