[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sourcetext"
version = "0.1.1"
description = "Return to source text alongside NLP model output and record interpretive judgments in situ."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kasper Fyhn", email = "kasperfyhnjacobsen@gmail.com" }]
requires-python = ">=3.10"
keywords = ["nlp", "digital humanities", "annotation", "model evaluation", "close reading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Framework :: Jupyter",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.22",
    "pandas>=2.0",
    "duckdb>=1.0",
    "sqlalchemy>=2.0",
    "duckdb-engine>=0.13",
    "fastapi>=0.110",
    "fastapi-camelcase>=2.0.0",
    "uvicorn>=0.29",
    "nest-asyncio>=1.6.0"
]

[project.urls]
Homepage = "https://github.com/KasperFyhn/sourcetext"
Repository = "https://github.com/KasperFyhn/sourcetext"
Issues = "https://github.com/KasperFyhn/sourcetext/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "pre-commit>=4.0",
    "build>=1.0",
    "twine>=5.0",
    "httpx2",
]

# The built UI (sourcetext/server/static/) is gitignored, which hatch would otherwise
# skip. `artifacts` must be set at build level, not just on the wheel target, because
# `python -m build` builds the wheel from the sdist -- the sdist has to carry it too.
[tool.hatch.build]
artifacts = ["sourcetext/server/static/**"]

[tool.hatch.build.targets.sdist]
only-include = [
    "sourcetext/",
    "tests/",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["sourcetext"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]