name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci # Wait for all CI jobs (lint, test, build) to pass
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sourcetext
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC), no API token needed

    steps:
      - uses: actions/checkout@v5

      - name: Check version matches release tag
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "pyproject.toml version ($version) does not match release tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      # The package built and verified by the CI build job.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
