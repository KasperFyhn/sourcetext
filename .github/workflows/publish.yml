name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci # Wait for all CI jobs (lint, test, build) to pass
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sourcetext
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC), no API token needed

    steps:
      # The package built and verified by the CI build job.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # The version comes from the git tag, so this fails if the build didn't see it.
      - name: Check built version matches release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/sourcetext-${version}-py3-none-any.whl" ] || [ ! -f "dist/sourcetext-${version}.tar.gz" ]; then
            echo "Built package version does not match release tag ($GITHUB_REF_NAME):"
            ls dist/
            exit 1
          fi

      - uses: pypa/gh-action-pypi-publish@release/v1
