repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: prettier
        name: prettier (ui)
        entry: ui/node_modules/.bin/prettier --write --ignore-unknown --ignore-path ui/.prettierignore
        language: system
        files: ^ui/
